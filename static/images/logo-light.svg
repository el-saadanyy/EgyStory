<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48">
  <defs>
    <linearGradient id="egyGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="40%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
  </defs>

  <!-- Golden Crown & Ankh Emblem -->
  <g transform="translate(4, 2)" fill="none" stroke="url(#egyGoldLight)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central Spire (Pyramid Peak) -->
    <polygon points="22,2 38,40 6,40" stroke-width="2.2"/>
    <line x1="22" y1="2" x2="22" y2="16" stroke-width="1.8"/>

    <!-- Left Wing -->
    <polyline points="6,40 1,18 16,25" stroke-width="2.2"/>

    <!-- Right Wing -->
    <polyline points="38,40 43,18 28,25" stroke-width="2.2"/>

    <!-- Base Line -->
    <line x1="6" y1="40" x2="38" y2="40" stroke-width="2.2"/>

    <!-- Ankh - Key of Life -->
    <path d="M 22,12 C 16,12 14,19 14,24 C 14,29 18,31 22,31 C 26,31 30,29 30,24 C 30,19 28,12 22,12 Z" stroke-width="2" fill="none"/>
    
    <polygon points="22,14 17,23 22,30 27,23" stroke-width="1.2"/>
    <line x1="22" y1="14" x2="22" y2="30" stroke-width="1"/>
    <line x1="17" y1="23" x2="27" y2="23" stroke-width="1"/>
    <line x1="19" y1="18" x2="25" y2="27" stroke-width="0.8"/>
    <line x1="25" y1="18" x2="19" y2="27" stroke-width="0.8"/>

    <!-- Crossbar -->
    <polygon points="12,32 32,32 32,36 12,36" fill="url(#egyGoldLight)" stroke="none"/>

    <!-- Stem (flared base) -->
    <polygon points="19,36 25,36 27,44 17,44" fill="url(#egyGoldLight)" stroke="none"/>
  </g>

  <!-- Brand Typography (Deep Charcoal Egy + Rich Pharaonic Gold Story) -->
  <text x="56" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5">
    <tspan fill="#1A1916">Egy</tspan><tspan fill="url(#egyGoldLight)">Story</tspan>
  </text>
</svg>
