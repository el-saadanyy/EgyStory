{% if messages %}
<div
  class="messages-container"
  id="toast-container"
  role="region"
  aria-live="polite"
  aria-label="Notifications"
  style="position: fixed; top: 100px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; width: 360px; max-width: calc(100vw - 32px); pointer-events: none;"
>
  {% for message in messages %}
    <div
      class="alert alert-{{ message.tags|default:'info' }}"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
      data-auto-dismiss
      style="pointer-events: auto;"
    >
      {# Icon per message type #}
      {% if message.tags == 'success' %}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0;margin-top:1px" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      {% elif message.tags == 'error' %}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0;margin-top:1px" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      {% elif message.tags == 'warning' %}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0;margin-top:1px" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      {% else %}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0;margin-top:1px" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {% endif %}

      <span style="flex:1;line-height:1.5;">{{ message }}</span>

      <button class="alert-close" aria-label="Dismiss notification" title="Dismiss">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      {# Countdown progress bar #}
      <div class="alert-progress" aria-hidden="true"></div>
    </div>
  {% endfor %}
</div>
{% endif %}
