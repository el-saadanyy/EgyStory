{% load static %}
<!-- ── EgyStory AI Chatbot Assistant Widget ────────────────────── -->
<div class="egystory-chatbot-wrapper" id="egyStoryChatbot">
  <!-- Trigger Button -->
  <button type="button" class="egystory-chat-toggle-btn" id="chatToggleBtn" aria-label="Open EgyStory AI Assistant">
    <span class="chat-icon-open">
      <!-- Modern Cute Robot Icon -->
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="4"></rect>
        <circle cx="12" cy="5" r="2"></circle>
        <path d="M12 7v4"></path>
        <line x1="8" y1="16" x2="8.01" y2="16" stroke-width="3"></line>
        <line x1="16" y1="16" x2="16.01" y2="16" stroke-width="3"></line>
      </svg>
    </span>
    <span class="chat-icon-close">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </span>
  </button>

  <!-- Chat Window -->
  <div class="egystory-chat-window" id="chatWindow">
    <!-- Header -->
    <div class="egystory-chat-header">
      <div class="egystory-chat-header-info">
        <div class="egystory-chat-avatar">
          <!-- Robot Avatar Icon -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="10" rx="4"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <line x1="8" y1="16" x2="8.01" y2="16" stroke-width="3"></line>
            <line x1="16" y1="16" x2="16.01" y2="16" stroke-width="3"></line>
          </svg>
        </div>
        <div class="egystory-chat-title-group">
          <h4>EgyStory AI</h4>
          <div class="egystory-chat-status">Live Assistant</div>
        </div>
      </div>
      <div class="egystory-chat-header-actions">
        <!-- Language Switcher Pills -->
        <div class="egystory-chat-lang-switch">
          <button type="button" class="lang-btn active" data-lang="ar" title="العربية">AR</button>
          <button type="button" class="lang-btn" data-lang="en" title="English">EN</button>
        </div>
        <button type="button" class="egystory-chat-clear-btn" id="chatClearBtn" title="Clear Chat History">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
        <button type="button" class="egystory-chat-close-btn" id="chatCloseBtn" title="Close Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages Body -->
    <div class="egystory-chat-messages" id="chatMessages">
      <!-- Default Greeting -->
      <div class="chat-msg assistant">
        <div class="chat-msg-bubble">
          <div class="chat-greeting-title">أهلاً بك في EgyStory!</div>
          <div class="chat-greeting-desc">أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟ يمكنك سؤالي عن الحالات المتاحة، خطوات التبرع، أو إنشاء قصة جديدة.</div>
          
          <div class="chat-quick-suggestions">
            <button type="button" class="chat-chip" data-query="رشحلي حالات حرجة ومحتاجة تبرع">حالات حرجة</button>
            <button type="button" class="chat-chip" data-query="إزاي أبدأ قصة حملة تبرع جديدة؟">إنشاء حملة</button>
            <button type="button" class="chat-chip" data-query="إزاي أتبرع لحالة على المنصة؟">طريقة التبرع</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Input Form -->
    <div class="egystory-chat-footer">
      <form class="egystory-chat-input-form" id="chatForm">
        {% csrf_token %}
        <input 
          type="text" 
          id="chatInput" 
          class="egystory-chat-input" 
          placeholder="اكتب استفسارك هنا..." 
          autocomplete="off"
          maxlength="1000"
          required
        >
        <button type="submit" class="egystory-chat-send-btn" id="chatSendBtn" aria-label="Send Message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>
