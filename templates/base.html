<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{% block meta_description %}EgyStory — The Egyptian crowdfunding platform. Help real people, fund real stories.{% endblock %}">
  <title>{% block title %}EgyStory{% endblock %} — EgyStory</title>

  {% load static %}

  <!-- Design system -->
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  {% block extra_css %}{% endblock %}

  <!-- Favicon placeholder -->
  <link rel="icon" type="image/svg+xml" href="{% static 'images/logo.svg' %}">
</head>
<body class="{% if request.resolver_match.url_name == 'home' %}is-home{% endif %}">

  <!-- ── Navbar ─────────────────────────────────────────── -->
  {% include 'includes/navbar.html' %}

  <!-- ── Messages ───────────────────────────────────────── -->
  {% include 'includes/messages.html' %}

  <!-- ── Main Content ───────────────────────────────────── -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ─────────────────────────────────────────── -->
  {% include 'includes/footer.html' %}

  <!-- ── Scripts ────────────────────────────────────────── -->
  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_js %}{% endblock %}

</body>
</html>
