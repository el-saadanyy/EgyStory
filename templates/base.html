<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{% block meta_description %}EgyStory — The Egyptian crowdfunding platform. Help real people, fund real stories.{% endblock %}">
  <title>{% block title %}EgyStory{% endblock %} — EgyStory</title>

  {% load static %}
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">


  <!-- Design system -->
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=18.0">
  <link rel="stylesheet" href="{% static 'css/components.css' %}?v=18.0">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}?v=18.0">


  {% block extra_css %}{% endblock %}

  <!-- Favicon placeholder -->
  <link rel="icon" type="image/svg+xml" href="{% static 'images/logo.svg' %}?v=2.0">
</head>
<body class="{% if request.resolver_match.url_name == 'home' %}is-home{% endif %}">

  <!-- ── Navbar ─────────────────────────────────────────── -->
  {% include 'includes/navbar.html' %}

  <!-- ── Messages ───────────────────────────────────────── -->
  {% include 'includes/messages.html' %}

  <!-- ── Main Content ───────────────────────────────────── -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ─────────────────────────────────────────── -->
  {% include 'includes/footer.html' %}

  <!-- ── Scripts ────────────────────────────────────────── -->
  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_js %}{% endblock %}

</body>
</html>
