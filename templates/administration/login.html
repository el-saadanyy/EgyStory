<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — EgyStory</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/admin.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

<div class="admin-login-page">
  <div class="admin-login-card">

    <div class="admin-login-header">
      <img src="{% static 'images/logo.svg' %}" alt="EgyStory" height="36" class="admin-login-logo">
      <div class="admin-login-badge">Admin Access</div>
      <h1 class="admin-login-title">Admin Sign In</h1>
      <p class="admin-login-subtitle">
        Restricted to authorized administrators only.
      </p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-error admin-login-alert" role="alert">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" novalidate id="admin-login-form">
      {% csrf_token %}

      <div class="form-group">
        <label for="id_email" class="form-label">Admin Email</label>
        <input type="email" name="email" id="id_email" class="form-control"
          placeholder="admin@egystory.com" autocomplete="email" required autofocus>
      </div>

      <div class="form-group">
        <label for="id_password" class="form-label">Password</label>
        <div class="password-field">
          <input type="password" name="password" id="id_password" class="form-control"
            placeholder="Password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="admin-login-btn">
        Sign In to Admin Panel
      </button>
    </form>

    <div class="admin-login-footer">
      <a href="{% url 'home' %}" class="admin-login-back">← Back to EgyStory</a>
    </div>

  </div>
</div>

<script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
