{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    {% if validlink %}
                        <h3 class="card-title text-center mb-4">تعيين كلمة سر جديدة</h3>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                {{ form.as_p }}
                            </div>
                            <button type="submit" class="btn btn-success w-100">حفظ كلمة السر الجديدة</button>
                        </form>
                    {% else %}
                        <div class="alert alert-danger text-center">
                            <h4>رابط غير صالح أو منتهي الصلاحية!</h4>
                            <p>يبدو أن الرابط الذي استخدمته غير صحيح أو انتهت مدته.</p>
                            <a href="{% url 'password_reset' %}" class="btn btn-danger">طلب رابط جديد</a>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
